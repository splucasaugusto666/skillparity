name: Optional MCP smoke
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'mcp>=1.12,<2'
      - run: python tests/mcp_protocol_smoke.py
