[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "skillparity"
version = "1.1.0"
description = "Read-only Agent Skills drift detection across coding tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
keywords = ["agent-skills", "ai-agents", "drift-detection", "developer-tools", "ci"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]

[project.urls]
Repository = "https://github.com/splucasaugusto666/skillparity"
Issues = "https://github.com/splucasaugusto666/skillparity/issues"

[project.scripts]
skillparity = "skillparity:main"
skillparity-mcp = "skillparity_mcp:main"

[tool.setuptools]
py-modules = ["skillparity", "skillparity_mcp"]
